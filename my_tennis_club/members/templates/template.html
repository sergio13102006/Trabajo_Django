{% extends "master.html" %}

{% block title %}Lista de Miembros{% endblock %}

{% block styles %}

<style>

:root {
  --color-cancha: #2e8b57;
  --color-pelota: #dfff4f;
  --color-fondo-claro: #f4f7f6;
  --color-texto: #333333;
  --borde-radio: 12px;
  --color-hover: #256f46;
  --color-sombra: rgba(0, 0, 0, 0.1);
}

body {
  background-image: url("https://s3.abcstatics.com/media/bienestar/2019/08/02/tenis-abecedario-kgNF--1248x698@abc.jpg");
  background-size: cover;
  background-attachment: fixed;
  background-position: center center;
  background-repeat: no-repeat;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--color-texto);
  margin: 0;
  padding: 0;
  line-height: 1.6;
}

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(244, 247, 246, 0.9);
  z-index: -1;
}

.header-tenis {
  background: linear-gradient(135deg, var(--color-cancha), var(--color-hover));
  color: white;
  padding: 30px 20px;
  text-align: center;
  border-bottom: 5px solid var(--color-pelota);
  box-shadow: 0 4px 15px var(--color-sombra);
  border-radius: 0 0 var(--borde-radio) var(--borde-radio);
}

.header-tenis h1 {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 2.5em;
  text-shadow: 2px 2px 4px var(--color-sombra);
}

.contenido-principal {
  background-color: rgba(255, 255, 255, 0.95);
  border-radius: var(--borde-radio);
  padding: 40px;
  margin: 40px auto;
  max-width: 900px;
  box-shadow: 0 10px 40px var(--color-sombra);
  backdrop-filter: blur(5px);
}

.tabla-miembros {
  width: 100%;
  border-collapse: collapse;
  margin: 25px 0;
  font-size: 1em;
  font-family: sans-serif;
  min-width: 400px;
  box-shadow: 0 5px 25px var(--color-sombra);
  border-radius: var(--borde-radio);
  overflow: hidden;
}

.tabla-miembros thead tr {
  background: linear-gradient(135deg, var(--color-cancha), var(--color-hover));
  color: #ffffff;
  text-align: left;
  font-weight: bold;
}

.tabla-miembros th,
.tabla-miembros td {
  padding: 18px 20px;
  vertical-align: middle;
  border-bottom: 1px solid #e0e0e0;
}

.tabla-miembros tbody tr {
  transition: background-color 0.3s ease, color 0.3s ease;
}

.tabla-miembros tbody tr:nth-of-type(even) {
  background-color: #f9f9f9;
}

.tabla-miembros tbody tr:hover {
  background-color: #e0f2e8;
  font-weight: bold;
  color: var(--color-cancha);
  transform: scale(1.02);
  box-shadow: 0 2px 10px var(--color-sombra);
}

.btn-saque {
  background: linear-gradient(135deg, var(--color-cancha), var(--color-hover));
  color: white;
  padding: 12px 30px;
  border: none;
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px var(--color-sombra);
}

.btn-saque:hover {
  background: linear-gradient(135deg, var(--color-hover), #1e5a3a);
  transform: translateY(-3px);
  box-shadow: 0 6px 20px var(--color-sombra);
}

/* Media Queries para Responsividad */
@media (max-width: 768px) {
  .header-tenis h1 {
    font-size: 2em;
    letter-spacing: 1px;
  }

  .contenido-principal {
    padding: 20px;
    margin: 20px;
    max-width: 100%;
  }

  .tabla-miembros {
    font-size: 0.9em;
    min-width: auto;
  }

  .tabla-miembros th,
  .tabla-miembros td {
    padding: 12px 15px;
  }

  .btn-saque {
    padding: 10px 20px;
    font-size: 0.9em;
  }
}

@media (max-width: 480px) {
  .header-tenis {
    padding: 20px 10px;
  }

  .header-tenis h1 {
    font-size: 1.5em;
  }

  .contenido-principal {
    padding: 15px;
    margin: 10px;
  }

  .tabla-miembros {
    font-size: 0.8em;
  }
}
</style>
{% endblock %}

{% block content %}
<div class="header-tenis">
  <h1>Lista de Miembros</h1>
</div>

<div class="contenido-principal">
  <table class="tabla-miembros">
    <thead>
      <tr>
        <th>Nombre</th>
      </tr>
    </thead>
    <tbody>
      {% for miembro in miembros %}
      <tr>
        <td>{{ miembro.firstname }}</td>
      </tr>
      {% empty %}
      <tr>
        <td>No hay miembros registrados.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <p><a href="/" class="btn-saque">Volver al Inicio</a></p>
</div>
{% endblock %}
